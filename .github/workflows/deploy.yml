name: Deploy GitHub Tutorial to Pages

on:
  # Сборка и деплой при каждом изменении в main
  push:
    branches: [main]
  # Проверка сборки для pull request'ов (без деплоя)
  pull_request:
    branches: [main]
  # Кнопка Run workflow на странице Actions
  workflow_dispatch:

# Права, необходимые actions/deploy-pages для публикации на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Не запускать параллельные сборки: новая отменяет предыдущую
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Сборка сайта
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Настройка Pages (метаданные; не критично, если Pages ещё не включён)
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Проверка наличия index.html
        run: |
          test -f index.html || { echo "::error::index.html не найден"; exit 1; }
          echo "Сборка: $(ls -la)"

      - name: Загрузка артефакта сайта
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: Деплой на GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Проверка, что Pages включён
        id: check_pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --jq '.build_type' 2>/dev/null | grep -q "workflow"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "✅ Pages включён (build_type=workflow) — деплоим"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "⏭️  Pages ещё не включён. Включите один раз:"
            echo "    Settings → Pages → Build and deployment → Source: GitHub Actions"
            echo "    Затем перезапустите этот workflow (Actions → Deploy → Run workflow)."
          fi

      - name: Публикация
        id: deployment
        if: steps.check_pages.outputs.ready == 'true'
        uses: actions/deploy-pages@v4

      - name: Итог
        run: |
          if [ "${{ steps.check_pages.outputs.ready }}" = "true" ]; then
            echo "🚀 Сайт опубликован: ${{ steps.deployment.outputs.page_url }}"
          else
            echo "📖 Сборка успешна, но для публикации включите Pages (см. сообщение выше)"
          fi
